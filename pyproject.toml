[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastmock-api"
version = "0.1.1"
description = "A lightweight, local Mock server on FastAPI for frontend and mobile teams."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "faker>=19.0.0",
    "pyyaml>=6.0",
    "jsonref>=1.1.0",
    "python-multipart>=0.0.9",
    "typer>=0.9.0",
    "websockets>=12.0"
]

[project.scripts]
fastmock = "fastmock.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio",
    "httpx",
    "ruff",
    "mypy"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "UP", "SIM", "RUF", "BLE", "ASYNC"]
ignore = ["B008", "BLE001", "S110", "SIM102", "ASYNC230", "RUF059", "RUF002", "RUF003", "E501", "RUF001", "UP015", "ASYNC240", "E402"]

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["src/fastmock"]
