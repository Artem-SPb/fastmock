name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install hatch
        pip install -e ".[dev]"

    - name: Run Ruff (Linter & Formatter)
      run: |
        ruff check .
        
    - name: Run Pytest
      run: |
        pytest tests/ -v
